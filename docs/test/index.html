<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<meta name="author" content="">
<meta name="description" content="Shared over Making files smarter">
<meta name="keywords" content="Map Tiles">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/dTile/DT/dist/dtile.js"></script>
<script src="
https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js
"></script>
<link href="
https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css
" rel="stylesheet">
<style>
.rel{
position:relative
}

.hidden{
visibility:hidden;
}
.tinyinput{
color:blue;
font-size:12px;
width:30px;
}
.maph{
height: calc(100% - 100px);
width: 100%;
}
.sbutton{
box-sizing:border-box;
border-radius:2px;
padding:2px;
text-align:center;
text-decoration:none;
color:darkblue;
margin:2px;
cursor:pointer;
outline:1px solid;
outline-offset:-2px;
display:inline-block;
}
.push-right{
float:right !important;
}
.push-left{
float:left !important;
}
.bottom-left{
position:absolute;
bottom:3px;
left:3px;
z-index:1001;
}
.top-right{
position:absolute;
top:3px;
right:3px;
z-index:1001;
}

.opacity5{opacity:0.5;}
.vlabel{
background-color:black;
cursor:pointer;
color:white;
font-size:12px;
padding:1px;
margin:1px;
font-weight:600;
opacity:0.95;
}
</style>
</head>
<body id=dbody style1="overflow-x:hidden!important;scrollbar-width:none!important;">
<div class=rel>
level:<input class=tinyinput id=level value=4 type="number" min="0" max="9">&nbsp;
Perimeter:<input class=tinyinput id=perimeter value=5 type="number" min="0" max="20">&nbsp;
Precision:<input class=tinyinput id=precision value=7 type="number" min="6" max="12">&nbsp;
<button id=btnApply type=button class=sbutton title="Add tiles around the center of the map">Apply</button>
<button id=btnClear type=button class=sbutton>clear</button><BR>
Marker:<input class=tinyinput1 id="m-coords" value="0,0" type="search">
<button id=btnSurround type=button class=sbutton>Surround</button>
<span id="curr-zoom"></span>
<span id="extras"></span>
<BR>
<div id=maph class=maph1 style="width:100%;height: calc(100vh - 80px); background-color: lightblue;">
</div>
<div id=message-area class="hidden bottom-left">
<div id=message-text class="vlabel">
</div>
</div>
</div>
</body>
</html>

<script>

function init(){
var map;
map=L.map('maph').setView([51.505, -0.09], 4);
var st = localStorage.getItem("lastMarker");
if(st){
	_('m-coords').value = st
}

L.control.scale({updateWhenIdle:true,position:"bottomright"}).addTo(map)
map.on("moveend",(e)=>{

var currZoom=parseInt(map.getZoom());
alrt("Zoom: "+ currZoom)
map.quadZoom=currZoom;
})

_("btnSurround").onclick=()=>{
let z=_('level').value;
let perimeter=parseInt(_("perimeter").value);
var st=_('m-coords').value;

var point=st2point(st);
if(point){
localStorage.setItem("lastMarker",st);

marker.setLatLng([point.lat,point.lng]).addTo(map);
var bingo=DT.get(point.lat,point.lng,z)
drawTiles(map,bingo.number,perimeter)
}else{
alrt("Non valid coordinates")
}
}

_("btnApply").onclick=()=>{
let z=_('level').value;
let perimeter=parseInt(_("perimeter").value);

var center=map.getCenter();
var maxLevel=_("level").value;
var bingo=DT.get(center.lat,center.lng,z)
drawTiles(map,bingo.number,perimeter)
}
_("btnClear").onclick=()=>clearMap();

function addExtas(tn){
var gj=document.createElement("button");
gj.innerHTML="Perimeter geoJSON";
gj.classList.add("sbutton")
_("extras").appendChild(gj)
gj.onclick=()=>{
console.log(tn)
getJSON(tn)
}
}

function clearMap(){
_("extras").innerHTML="";
if(map.tiles10){
map.tiles10.clearLayers();
}
}

function drawTiles(map,tn,perimeter){
clearMap();
let precision=parseInt(_("precision").value);
let z= parseInt(_("level").value);
var bingo=DT.decode(tn)

function qInfo(tl){
map.closePopup();
let precision=parseInt(_("precision").value);
var q=DT.decode(tl,precision);
var coords=q.coords;
var sLatSW=DT.nFormat(coords[0][0]);
var sLngSW=DT.nFormat(coords[0][1]);
var sLatNE=DT.nFormat(coords[2][0]);
var sLngNE=DT.nFormat(coords[2][1]);
var nw=DT.nFormat(coords[1][0])+","+DT.nFormat(coords[1][1]);
var corners="[[" + q.sw + "],[" + q.nw + "],[" + q.ne + "],[" + q.se+"]]";
var bounds=[[sLatNE,sLngNE],[sLatSW,sLngSW]]
var rect=[[sLatNE,sLngNE],[sLatSW,sLngNE],[sLatSW,sLngSW],[sLatNE,sLngSW]];
var center=L.latLngBounds(rect).getCenter();
center.lat=DT.nFormat(center.lat);
center.lng=DT.nFormat(center.lng);
const rectangleBounds=L.latLngBounds(rect)
const centerLat=rectangleBounds.getCenter().lat;
const eastPoint=L.latLng(centerLat, rectangleBounds.getEast());
const westPoint=L.latLng(centerLat, rectangleBounds.getWest());
var width=eastPoint.distanceTo(westPoint)
width=parseInt(width);
if(width > 1000){
width=width / 1000
var miles=DT.nFormat(width  /  1.609343502101154,2)
width=width + " km / "
width+=miles + " miles"
}else{
width=width + " meters"
}
var name=q.name;
if(q.number){
name=q.number;
}
var det="";
det+='<div class=sbutton style="display:inline-block;margin:0;">';
det+="<h4>Decimal Tile Info</h4>";
det+='<a class="sbutton" title="Copy tile number" onclick=copyText('+tl+')>'+tl+'</a>';
det+='<a class="sbutton" title="Download geoJSON" onclick=getJSON('+tl+')>'+"&dArr;"+' geoJSON</a>';
det+="<BR>";
det+="x:" + q.x + " y:" + q.y + " z:" + q.z;
det+="<BR>";
det+=" Width: " + width;
det+="<BR>";
det+='<a class="sbutton" title="Copy corners array" onclick=copyText("'+ corners +'")>Corners (clockwise):</a>';
det+="<BR>";
det+="<span class=push-right>";
det+='SW: <a class="sbutton" title="Copy SW corner" onclick=copyText("'+ q.sw +'")>'+q.sw+'</a>';
det+="<BR>";
det+='NW: <a class="sbutton" title="Copy NW corner" onclick=copyText("'+ q.nw +'")>'+q.nw+'</a>';
det+="<BR>";
det+='NE: <a class="sbutton" title="Copy NW corner" onclick=copyText("'+ q.ne +'")>'+q.ne+'</a>';
det+="<BR>";
det+='SE: <a class="sbutton" title="Copy NW corner" onclick=copyText("'+ q.se +'")>'+q.se+'</a>';
det+="</span>";
det+="<BR>";
det+="<BR>"
det+="</div>"
map.tiles10.bindPopup(det).openPopup();
}

if(bingo){
var pl=L.polygon(bingo.coords,{color:"green",fillOpacity:0.04,title:"Device center"}).addTo(map.tiles10);
var pr=DT.perim(bingo.number,perimeter,6,true);
pr.forEach(function(square,i){
if(square.type == "perimeter"){
//console.log(square.coords)
var plPerim=L.polygon(square.coords,{color:"red",opacity:0.7,weight:2,fillOpacity:0.01,dashArray:"2",title:title})
var bounds=plPerim.getBounds();
map.fitBounds(bounds,{padding:[-70,-70]})
}
if(square.type == "dtile"){
var title=square.number;//' x:'+square.x+' y:'+square.y + ' z:'+square.z;
var pl=L.polygon(square.coords,{color:"purple",opacity:0.7,weight:2,fillOpacity:0.01,dashArray:"2"}).addTo(map.tiles10);
pl.tl=square.number
pl.on("click",()=>{
qInfo(pl.tl)
})

var ttp=L.tooltip({
opacity:0.9,
offset:[4,4],
interactive:true,
bubblingMouseEvents:false,
className:"sbutton",
permanent:false,
direction:"bottom"
}).setContent(square.number);
pl.bindTooltip(ttp);
}
})

qInfo(tn);
addExtas(tn+"."+perimeter);
}
}

var marker=L.marker(0,0)
map.on("click",(e)=>{
var precision=_('precision').value;
var lat=e.latlng.lat;
var lng=e.latlng.lng;
var latlng=DT.nFormat(lat,precision)+","+DT.nFormat(lng,precision);
marker.setLatLng(e.latlng).addTo(map);
_('m-coords').value=latlng;
localStorage.setItem("lastMarker",st);

var ttp=L.tooltip({
opacity:0.9,
offset:[4,4],
interactive:true,
bubblingMouseEvents:false,
className:"sbutton",
permanent:false,
direction:"bottom"
}).setContent(latlng);

marker.bindTooltip();

console.log(e);
let z=parseInt(_("level").value);
let perimeter=parseInt(_("perimeter").value);

var tile=DT.get(lat,lng,z);
drawTiles(map,tile.number,perimeter)
})

L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {clickable:true,crossOrigin:true,maxZoom:23,maxNativeZoom:20,
attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
var tiles10=map.tiles10=new L.FeatureGroup({interactive:false}).addTo(map);
var g0=DT.split100(0,0,0)
g0.forEach((q)=>{

var coords=[q.sw,q.nw,q.ne,q.se];
pl=L.polygon(coords,{title:q.number});
pl.addTo(tiles10);
})
}//init end


//helpers start
function st2point(st){
var o
var arr=st.trim().split(',');
if(arr.length>1){
var lat=Number(arr[0])
var lng=Number(arr[1])
if(lat>=-90&&lat<=90&&lng>=-180&&lng>=-180){
o={lat:arr[0],lng:arr[1]}
}
}
return o
}

function _(d){return document.getElementById(d)}
function getJSON(tl){
debugger;
var q=DT.decode(tl)
var dname;
if(q.p){
j=DT.perimJSON(tl,q.p);
dname=tl.replace(".","_")  +".json"
}
else{
dname=tl +".json"
j=DT.tileJSON(q.x,q.y,q.z,6);
}
let a=document.createElement("a")
a.download=dname;
j=new Blob([j], {type: "text/plain"});
a.href=URL.createObjectURL(j);
a.click();
}

function alrt(text){
_('message-text').innerHTML=text;
_('message-area').classList.remove('hidden');
setTimeout(()=>{
_('message-text').innerHTML="";
_('message-area').classList.add('hidden');
},4000);
}

function copyText(text){
navigator.clipboard.writeText(text)
.then(() => {
console.log(text);
alrt(text+"<BR>copied!")
})
.catch(err => {
console.error("Failed to copy text: ", err);
});
}
//helpers end

init();

</script>
